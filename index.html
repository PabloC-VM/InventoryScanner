<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5A19A2">
<meta name="robots" content="noindex">
<title>Versatile Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --purple:#5A19A2; --purple-dark:#430F7D; --orange:#FF6400; --ink:#1E1430; --muted:#6E6680; --bg:#F6F3FA; --ok:#15803D; --bad:#B91C1C; --line:#E6E0EF; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { font-family:Poppins,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:var(--ink); background:var(--bg);
         display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
  button { font-family:inherit; }
  header { background:var(--purple); padding:10px 14px; padding-top:max(10px, env(safe-area-inset-top)); display:flex; align-items:center; justify-content:space-between; flex:0 0 auto; }
  header img { height:24px; display:block; }
  header .tools { display:flex; gap:8px; }
  header button { border:0; border-radius:10px; min-width:40px; height:36px; padding:0 8px; background:rgba(255,255,255,.14); color:#fff; display:grid; place-items:center; }
  header button.on { background:var(--orange); }
  header button svg { width:20px; height:20px; }

  /* camera */
  .cam { position:relative; flex:0 0 auto; height:32dvh; min-height:180px; background:#000; overflow:hidden; touch-action:manipulation; }
  .cam video { position:absolute; display:block; }
  #boxes { position:absolute; inset:0; }
  .box { position:absolute; border:3px solid var(--orange); border-radius:8px; background:rgba(255,100,0,.12); padding:0; cursor:pointer;
         box-shadow:0 0 0 2px rgba(0,0,0,.25); transition:left .12s, top .12s, width .12s, height .12s; }
  .box span { position:absolute; left:-3px; bottom:100%; margin-bottom:3px; background:var(--orange); color:#fff; font:700 12px "Courier New",monospace;
              padding:2px 6px; border-radius:6px; white-space:nowrap; }
  .box.other { border-color:rgba(255,255,255,.6); background:transparent; pointer-events:none; }
  .box.other span { background:rgba(0,0,0,.6); font-family:Poppins,sans-serif; font-weight:400; }
  .box.open { border-color:#22C55E; background:rgba(34,197,94,.15); } .box.open span { background:#16A34A; }
  .zoom { position:absolute; left:12px; right:12px; bottom:10px; display:flex; align-items:center; gap:10px; color:#fff; font-size:12px; }
  .zoom input { flex:1; accent-color:var(--orange); height:28px; }
  .zoom b { min-width:38px; text-align:right; font-weight:600; text-shadow:0 1px 2px #000; }
  .toast { position:absolute; left:50%; top:10px; transform:translateX(-50%); background:rgba(30,20,48,.85); color:#fff; font-size:12px; padding:5px 12px; border-radius:999px; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap; }
  .toast.show { opacity:1; }
  .msg { position:absolute; inset:0; display:none; place-items:center; text-align:center; color:#fff; padding:20px; font-size:14px; background:rgba(30,20,48,.9); }
  .msg.show { display:grid; }
  .msg button { margin-top:12px; background:var(--orange); color:#fff; border:0; border-radius:10px; padding:10px 18px; font-weight:600; font-size:15px; }

  /* pop-up list of detected labels */
  .pop { flex:0 0 auto; background:#fff; border-bottom:1px solid var(--line); padding:10px 14px; display:none; }
  .pop.show { display:block; animation:up .2s ease-out; }
  @keyframes up { from { transform:translateY(8px); opacity:0; } }
  .pop .head { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); margin-bottom:8px; }
  .pop .head button { border:0; background:none; color:var(--muted); font-size:20px; line-height:1; padding:0 4px; }
  .pop .list { display:flex; flex-wrap:wrap; gap:8px; }
  .pop .list button { border:0; border-radius:10px; padding:9px 14px; background:var(--orange); color:#fff; font:700 15px "Courier New",monospace; box-shadow:0 3px 0 #E05500; }
  .pop .list button.open { background:#16A34A; box-shadow:0 3px 0 #15803D; }

  .status { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:8px 14px; background:#fff; border-bottom:1px solid var(--line); font-size:13px; min-height:40px; }
  .status .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); flex:0 0 auto; }
  .status.scanning .dot { background:var(--orange); animation:pulse 1.2s infinite; }
  .status.ok .dot { background:var(--ok); } .status.bad .dot { background:var(--bad); }
  @keyframes pulse { 50% { opacity:.3; } }
  .status .text { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .status button { border:0; border-radius:8px; padding:5px 12px; background:var(--purple); color:#fff; font-weight:600; font-size:13px; }
  .chips { flex:0 0 auto; display:flex; gap:6px; overflow-x:auto; padding:8px 14px; background:#fff; border-bottom:1px solid var(--line); scrollbar-width:none; }
  .chips:empty { display:none; }
  .chips button { flex:0 0 auto; border:1px solid #DCD2EA; background:#fff; border-radius:999px; padding:4px 10px; font:700 12px "Courier New",monospace; color:var(--purple); }
  .chips button.cur { background:var(--purple); color:#fff; border-color:var(--purple); }
  .detail { position:relative; flex:1 1 auto; min-height:0; background:#fff; }
  .detail iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .placeholder { position:absolute; inset:0; display:grid; place-items:center; text-align:center; color:var(--muted); padding:24px; font-size:14px; overflow:auto; }
  .placeholder b { display:block; color:var(--ink); font-size:16px; margin-bottom:4px; }
  .manual { display:flex; gap:8px; margin-top:14px; justify-content:center; }
  .manual input { width:170px; padding:9px 10px; border:1px solid #DCD2EA; border-radius:10px; font:400 15px Poppins,sans-serif; }
  .manual button { border:0; border-radius:10px; padding:0 14px; background:var(--purple); color:#fff; font-weight:600; font-size:14px; }
</style>
</head>

    <button id="pause" type="button" title="Pause camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg></button>
  </div>
</header>
<section class="cam" id="cam">
  <video id="video" playsinline muted autoplay></video>
  <div id="boxes"></div>
  <div class="zoom"><span>−</span><input id="zoom" type="range" min="0" max="1000" value="0" aria-label="Zoom"><span>+</span><b id="zoomLabel">1.0×</b></div>
  <div class="toast" id="toast"></div>
  <div class="msg" id="camMsg"><div><div id="camMsgText"></div><button id="camBtn" type="button">Start camera</button></div></div>
</section>
<div class="pop" id="pop"><div class="head"><span>Labels in view: tap one to open</span><button id="popClose" type="button" aria-label="Close">×</button></div><div class="list" id="popList"></div></div>
<div class="status scanning" id="status"><span class="dot"></span><span class="text" id="statusText">Starting camera…</span><button id="retry" type="button" hidden>Retry</button></div>
<div class="chips" id="chips"></div>
<section class="detail">
  <div class="placeholder" id="placeholder"><div><b>Point the camera at a label</b>Each label it reads gets an orange box. Tap the box (or the ID button) of the one you want, and its details show here.
    <div class="manual"><input id="manual" placeholder="VM-00001" autocapitalize="characters" autocomplete="off"><button id="go" type="button">Go</button></div></div></div>
  <iframe id="frameItem" title="Equipment details" hidden></iframe>
</section>
<canvas id="canvas" hidden></canvas>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
/* ===== SETTINGS: the Google web app URL (ends in /exec) ===== */
const APP_URL = 'https://script.google.com/a/macros/versatile.media/s/AKfycbwxtmWdaZCC4qKGuQ6VGBBUqA-nRNWU_0kffyR1PRAlXv9qWWc3mtbga5SOKVdJABHH/exec';
/* ============================================================ */

const $ = s => document.getElementById(s);
const ID_RE = /VM-\d{5}/i;
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let stream = null, track = null, paused = false, detector = null, zx = null, hwZoom = null;
let cameras = [], camIndex = 0, currentId = '', loadTimer = null, popHideTimer = null;
const seen = new Map();          // text -> { id, box:{x,y,w,h} in video px, last, first }
const history = [];

/* ---------------- small helpers ---------------- */
function setStatus(kind, text, retry) {
  $('status').className = 'status ' + kind; $('statusText').textContent = text; $('retry').hidden = !retry;
}
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1800); }
const idOf = text => { const m = String(text).match(ID_RE); return m ? m[0].toUpperCase() : null; };

/* ---------------- opening an item (always inside this page) ---------------- */
function openItem(id) {
  currentId = id;
  $('placeholder').hidden = true;
  const f = $('frameItem'); f.hidden = false;
  f.src = APP_URL + '?embed=1&id=' + encodeURIComponent(id) + '&t=' + Date.now();
  setStatus('scanning', 'Loading ' + id + '…');
  clearTimeout(loadTimer);
  loadTimer = setTimeout(() => { if (currentId === id) setStatus('bad', id + ': details did not load. Check you are signed in to your versatile.media Google account.', true); }, 12000);
  const i = history.indexOf(id); if (i >= 0) history.splice(i, 1);
  history.unshift(id); drawChips(); drawPop(); drawBoxes();
  if (navigator.vibrate) navigator.vibrate(50);
}
function drawChips() {
  const c = $('chips'); c.innerHTML = '';
  history.forEach(id => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = id; if (id === currentId) b.className = 'cur';
    b.onclick = () => openItem(id); c.appendChild(b);
  });
}
$('retry').onclick = () => currentId && openItem(currentId);
window.addEventListener('message', e => {
  const d = e.data;
  if (!d || d.source !== 'versatile-inventory') return;
  let host = ''; try { host = new URL(e.origin).hostname; } catch (err) {}
  if (!/(^|\.)googleusercontent\.com$|^script\.google\.com$/.test(host)) return;
  clearTimeout(loadTimer);
  if (d.type === 'item') setStatus('ok', d.id + '  ' + (d.name || ''));
  else if (d.type === 'notfound') setStatus('bad', d.error || 'Not found');
  else if (d.type === 'denied') setStatus('bad', 'This Google account is not authorized. Sign in with your versatile.media account.', true);
});

/* ---------------- detected labels: boxes on the video + pop-up list ---------------- */
function videoToScreen(b) {
  const v = $('video'), sx = v._dw / v.videoWidth, sy = v._dh / v.videoHeight;
  return { x: v._dx + b.x * sx, y: v._dy + b.y * sy, w: b.w * sx, h: b.h * sy };
}
let pausedAt = 0;
const boxEls = new Map();            // text -> element (reused so a tap is never lost mid-redraw)
function drawBoxes() {
  const host = $('boxes');
  if (!$('video').videoWidth) return;
  const ref = paused ? pausedAt : Date.now();
  const live = new Set();
  seen.forEach((s, text) => {
    if (ref - s.last > 700) return;            // only labels in view right now (or when paused)
    live.add(text);
    let el = boxEls.get(text);
    if (!el) {
      el = document.createElement(s.id ? 'button' : 'div');
      const tag = document.createElement('span'); tag.textContent = s.id || 'Not a Versatile label'; el.appendChild(tag);
      if (s.id) {
        el.type = 'button'; el.setAttribute('aria-label', 'Open ' + s.id);
        el.addEventListener('pointerdown', ev => { ev.preventDefault(); openItem(s.id); });
      }
      host.appendChild(el); boxEls.set(text, el);
    }
    el.className = 'box' + (s.id ? (s.id === currentId ? ' open' : '') : ' other');
    const r = videoToScreen(s.box), pad = 6;
    Object.assign(el.style, { left: (r.x - pad) + 'px', top: (r.y - pad) + 'px', width: (r.w + pad * 2) + 'px', height: (r.h + pad * 2) + 'px' });
  });
  for (const [text, el] of boxEls) if (!live.has(text)) { el.remove(); boxEls.delete(text); }
}
function drawPop() {
  const now = Date.now();
  const ids = [...new Set([...seen.values()].filter(s => s.id && now - s.last < 4000).sort((a, b) => a.first - b.first).map(s => s.id))];
  const list = $('popList'); list.innerHTML = '';
  ids.forEach(id => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = id; if (id === currentId) b.className = 'open';
    b.onclick = () => openItem(id); list.appendChild(b);
  });
  $('pop').classList.toggle('show', ids.length > 0 && !$('pop')._closed);
}
$('popClose').onclick = () => { $('pop')._closed = true; $('pop').classList.remove('show'); };

function onDetections(found) {          // found: [{ text, box }]
  const now = Date.now();
  let fresh = false;
  found.forEach(f => {
    const prev = seen.get(f.text);
    if (!prev || now - prev.last > 4000) { fresh = true; }
    seen.set(f.text, { id: idOf(f.text), box: f.box, last: now, first: prev && now - prev.last <= 4000 ? prev.first : now });
  });
  if (fresh && found.some(f => idOf(f.text))) {
    if (navigator.vibrate) navigator.vibrate(30);
    $('pop')._closed = false;
  }
  for (const [k, s] of seen) if (now - s.last > 15000) seen.delete(k);
  drawBoxes(); drawPop();
  if (!currentId && found.length) setStatus('scanning', 'Tap a box or an ID to open it');
}

/* ---------------- zoom: digital (full picture … fill … closer) + hardware zoom when available ---------------- */
function zoomRange() {
  const v = $('video'), cam = $('cam');
  const W = cam.clientWidth, H = cam.clientHeight, vw = v.videoWidth || 16, vh = v.videoHeight || 9;
  const fit = Math.min(W / vw, H / vh), fill = Math.max(W / vw, H / vh);
  return { W, H, vw, vh, fit, fill };
}
function applyZoom() {
  const v = $('video'), z = +$('zoom').value / 1000;                       // 0..1
  const r = zoomRange();
  // 0 = full picture, 0.25 = fills the window (default), 1 = max zoom
  const fillRatio = r.fill / r.fit, maxDigital = fillRatio * 3;
  let scale, hw = null;
  if (z <= 0.25) scale = 1 + (fillRatio - 1) * (z / 0.25);
  else {
    const t = (z - 0.25) / 0.75;
    if (hwZoom) { scale = fillRatio; hw = hwZoom.min + (hwZoom.max - hwZoom.min) * t; }
    else scale = fillRatio + (maxDigital - fillRatio) * t;
  }
  const dw = r.vw * r.fit * scale, dh = r.vh * r.fit * scale;
  v._dw = dw; v._dh = dh; v._dx = (r.W - dw) / 2; v._dy = (r.H - dh) / 2;
  Object.assign(v.style, { width: dw + 'px', height: dh + 'px', left: v._dx + 'px', top: v._dy + 'px' });
  if (track && hwZoom) { const target = hw == null ? hwZoom.min : hw; track.applyConstraints({ advanced: [{ zoom: target }] }).catch(() => {}); }
  const shown = (scale / fillRatio) * (hw != null ? hw / hwZoom.min : 1);
  $('zoomLabel').textContent = (shown < 1 ? shown.toFixed(2) : shown.toFixed(1)) + '×';
  store.set('vm-zoom', $('zoom').value);
  drawBoxes();
}
$('zoom').addEventListener('input', applyZoom);
window.addEventListener('resize', applyZoom);

/* ---------------- camera ---------------- */
async function listCameras() {
  try { cameras = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput'); } catch (e) { cameras = []; }
  $('camSwitch').hidden = cameras.length < 2;
}
function cameraName(i) {
  const d = cameras[i]; if (!d) return 'Camera';
  const back = /back|rear|environment|0, facing back/i.test(d.label), front = /front|user/i.test(d.label);
  const same = cameras.filter(c => (/back|rear|environment/i.test(c.label)) === back);
  const n = same.indexOf(d) + 1;
  return (front ? 'Front camera' : 'Back camera') + (same.length > 1 && !front ? ' ' + n : '') + (d.label ? '' : ' ' + (i + 1));
}
async function startCamera(deviceId) {
  $('camMsg').classList.remove('show');
  if (stream) stream.getTracks().forEach(t => t.stop());
  const video = deviceId ? { deviceId: { exact: deviceId } } : { facingMode: { ideal: 'environment' } };
  Object.assign(video, { width: { ideal: 1920 }, height: { ideal: 1080 } });
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: false, video }); }
  catch (err) {
    if (deviceId) { store.set('vm-cam', ''); return startCamera(); }
    $('camMsgText').textContent = 'Camera blocked or unavailable. Allow camera access for this site, then try again.';
    $('camMsg').classList.add('show'); setStatus('bad', 'Camera not available'); return;
  }
  const v = $('video'); v.srcObject = stream; await v.play().catch(() => {});
  track = stream.getVideoTracks()[0];
  try { await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  hwZoom = caps.zoom && caps.zoom.max > caps.zoom.min ? { min: caps.zoom.min, max: Math.min(caps.zoom.max, caps.zoom.min * 8) } : null;
  $('torch').hidden = !caps.torch; $('torch').classList.remove('on');
  await listCameras();
  const s = track.getSettings ? track.getSettings() : {};
  camIndex = Math.max(0, cameras.findIndex(c => c.deviceId === s.deviceId));
  if (s.deviceId) store.set('vm-cam', s.deviceId);
  if (!detector && 'BarcodeDetector' in window) {
    try {
      const sup = await BarcodeDetector.getSupportedFormats();
      const formats = ['qr_code', 'code_128'].filter(f => sup.includes(f));
      if (formats.length) detector = new BarcodeDetector({ formats });
    } catch (e) { detector = null; }
  }
  const waitDims = () => new Promise(r => { if (v.videoWidth) r(); else v.addEventListener('loadedmetadata', r, { once: true }); });
  await waitDims(); applyZoom();
  if (!currentId) setStatus('scanning', 'Scanning… point at a QR code or barcode');
  if (!loop.running) { loop.running = true; loop(); }
}
$('camSwitch').onclick = async () => {
  if (cameras.length < 2) return;
  camIndex = (camIndex + 1) % cameras.length;
  await startCamera(cameras[camIndex].deviceId);
  toast(cameraName(camIndex));
};

/* ---------------- decoding loop ---------------- */
function zxDecode() {
  if (!window.ZXing) return [];
  if (!zx) {
    const h = new Map();
    h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.QR_CODE, ZXing.BarcodeFormat.CODE_128]);
    h.set(ZXing.DecodeHintType.TRY_HARDER, true);
    zx = new ZXing.MultiFormatReader(); zx.setHints(h);
  }
  const v = $('video'), c = $('canvas'), W = v.videoWidth, H = v.videoHeight;
  if (!W) return [];
  // decode only the part of the picture that is visible in the window
  const cam = $('cam'), sx = W / v._dw, sy = H / v._dh;
  const x0 = Math.max(0, -v._dx * sx), y0 = Math.max(0, -v._dy * sy);
  const cw = Math.min(W, cam.clientWidth * sx), ch = Math.min(H, cam.clientHeight * sy);
  const s = Math.min(1, 1000 / Math.max(cw, ch));
  c.width = Math.round(cw * s); c.height = Math.round(ch * s);
  c.getContext('2d', { willReadFrequently: true }).drawImage(v, x0, y0, cw, ch, 0, 0, c.width, c.height);
  try {
    const r = zx.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c))));
    const pts = (r.getResultPoints() || []).map(p => ({ x: x0 + p.getX() / s, y: y0 + p.getY() / s }));
    let box;
    if (pts.length >= 3) {
      const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
      const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
      const m = Math.max(maxX - minX, maxY - minY) * 0.12;   // finder-pattern centres sit inside the code
      box = { x: minX - m, y: minY - m, w: maxX - minX + 2 * m, h: maxY - minY + 2 * m };
    } else if (pts.length === 2) {                              // 1D barcode: a scan line, give it some height
      const minX = Math.min(pts[0].x, pts[1].x), maxX = Math.max(pts[0].x, pts[1].x), y = (pts[0].y + pts[1].y) / 2, w = maxX - minX;
      box = { x: minX, y: y - w * 0.15, w, h: w * 0.3 };
    } else box = { x: x0 + cw * 0.3, y: y0 + ch * 0.3, w: cw * 0.4, h: ch * 0.4 };
    return [{ text: r.getText(), box }];
  } catch (e) { return []; }
}
async function loop() {
  if (stream && !paused && $('video').readyState >= 2) {
    let found = [];
    if (detector) {
      try {
        const r = await detector.detect($('video'));
        found = r.map(b => ({ text: b.rawValue, box: { x: b.boundingBox.x, y: b.boundingBox.y, w: b.boundingBox.width, h: b.boundingBox.height } }));
      } catch (e) { detector = null; }
    } else found = zxDecode();
    onDetections(found);
  } else drawBoxes();
  setTimeout(loop, detector ? 110 : 200);
}

/* ---------------- controls ---------------- */
$('pause').onclick = () => {
  paused = !paused; $('pause').classList.toggle('on', paused);
  if (paused) { pausedAt = Date.now(); $('video').pause(); setStatus('', 'Paused. Boxes stay tappable. Tap pause again to keep scanning.'); }
  else { $('video').play(); setStatus(currentId ? 'ok' : 'scanning', currentId ? currentId : 'Scanning…'); }
};
$('torch').onclick = async () => {
  const on = !$('torch').classList.contains('on');
  try { await track.applyConstraints({ advanced: [{ torch: on }] }); $('torch').classList.toggle('on', on); } catch (e) {}
};
$('camBtn').onclick = () => startCamera(store.get('vm-cam') || undefined);
$('go').onclick = () => { const t = $('manual').value.trim(); const id = idOf(/^\d{1,5}$/.test(t) ? 'VM-' + t.padStart(5, '0') : t); if (id) openItem(id); else toast('Type an ID like VM-00001'); };
$('manual').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
document.addEventListener('visibilitychange', () => {   // release the camera while the app is in the background
  if (document.hidden && stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  else if (!document.hidden && !stream && !$('camMsg').classList.contains('show')) startCamera(store.get('vm-cam') || undefined);
});

/* ---------------- start ---------------- */
$('zoom').value = store.get('vm-zoom') || 250;   // 250 = fill the window
if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(APP_URL)) {
  $('camMsgText').textContent = 'Setup needed: paste the web app URL (ending in /exec) into APP_URL in index.html.';
  $('camBtn').hidden = true; $('camMsg').classList.add('show'); setStatus('bad', 'Not configured');
} else {
  const start = idOf(new URLSearchParams(location.search).get('id') || '');
  if (start) { openItem(start); history.length && drawChips(); }   // opened from a label scanned with the phone camera
  startCamera(store.get('vm-cam') || undefined);
}
</script>
</body>
</html>
